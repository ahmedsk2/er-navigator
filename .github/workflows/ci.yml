name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  # Database-backed checks and the Playwright suite against the production Postgres image:
  # migrations, role sync, seed, then the app on a normal build behind `pnpm start`.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      OWNER_URL: postgresql://ernav_owner:devowner@localhost:5432/ernav?schema=public
      APP_URL_DB: postgresql://ernav_app:devapp@localhost:5432/ernav?schema=public
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f docker-compose.dev.yml up -d --wait db
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma migrate deploy
        env: { DATABASE_URL: ${{ env.OWNER_URL }} }
      - run: pnpm exec tsx prisma/sync-app-role.ts
        env: { DATABASE_URL: ${{ env.OWNER_URL }}, APP_DB_USER: ernav_app, APP_DB_PASSWORD: devapp }
      - run: pnpm exec tsx prisma/seed.ts
        env: { DATABASE_URL: ${{ env.OWNER_URL }}, ADMIN_USERNAME: admin, ADMIN_PASSWORD: ci-only-password, ADMIN_DISPLAY_NAME: CI }
      - name: privilege guard (app role cannot delete audit rows)
        run: |
          set -e
          CID=$(docker compose -f docker-compose.dev.yml ps -q db)
          R=$(docker exec "$CID" psql -U ernav_owner -d ernav -tAc "SELECT has_table_privilege('ernav_app','\"AuditLog\"','DELETE')")
          test "$R" = "f"
      - run: pnpm build
      - name: cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
        env: { DATABASE_URL: ${{ env.APP_URL_DB }}, CI: 'true' }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
