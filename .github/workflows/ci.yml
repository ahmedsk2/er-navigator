name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: shell scripts parse (an entrypoint syntax error is a full outage)
        run: |
          set -e
          for f in docker/entrypoint.sh docker/postgres-init/01-app-role.sh scripts/migrate-and-seed.sh; do sh -n "$f"; done
          bash -n scripts/backup.sh
          bash -n scripts/demo-reset.sh
          if grep -rl -P '\x00' docker/entrypoint.sh docker/postgres-init/01-app-role.sh scripts/ docs/*.md docs/specs README.md CLAUDE.md; then echo "NUL byte in a script or doc"; exit 1; fi
      - run: pnpm exec prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      # The Docker build stage runs the same commands; a bundle that no longer builds would
      # otherwise only surface as a failed deploy.
      - run: pnpm run build:worker
      - run: pnpm run build:demo-seed

  # Database-backed checks and the Playwright suite against the production Postgres image:
  # migrations, role sync, seed, then the app on a normal build behind `pnpm start`.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      OWNER_URL: postgresql://ernav_owner:devowner@localhost:5432/ernav?schema=public
      APP_URL_DB: postgresql://ernav_app:devapp@localhost:5432/ernav?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f docker-compose.dev.yml up -d --wait db
      - run: pnpm exec prisma generate
      - name: migrate deploy (owner role)
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.OWNER_URL }}
      - name: reconcile the app role
        run: pnpm exec tsx prisma/sync-app-role.ts
        env:
          DATABASE_URL: ${{ env.OWNER_URL }}
          APP_DB_USER: ernav_app
          APP_DB_PASSWORD: devapp
      - name: seed
        run: pnpm exec tsx prisma/seed.ts
        env:
          DATABASE_URL: ${{ env.OWNER_URL }}
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: ci-only-password
          ADMIN_DISPLAY_NAME: CI
      - name: database-backed tests (owner role; vitest includes tests/db only when DATABASE_URL is set)
        run: pnpm test
        env:
          DATABASE_URL: ${{ env.OWNER_URL }}
      - name: privilege guard (every revoked privilege of the app role, hard rule 5)
        run: |
          set -e
          CID=$(docker compose -f docker-compose.dev.yml ps -q db)
          Q="SELECT has_table_privilege('ernav_app','\"AuditLog\"','UPDATE'), has_table_privilege('ernav_app','\"AuditLog\"','DELETE'), has_table_privilege('ernav_app','\"CaseUpdate\"','UPDATE'), has_table_privilege('ernav_app','\"CaseUpdate\"','DELETE'), has_table_privilege('ernav_app','\"Case\"','DELETE'), has_table_privilege('ernav_app','\"User\"','DELETE'), has_table_privilege('ernav_app','\"Alert\"','DELETE'), (SELECT rolsuper FROM pg_roles WHERE rolname='ernav_app')"
          R=$(docker exec "$CID" psql -U ernav_owner -d ernav -tAc "$Q")
          echo "privileges (AuditLog U/D, CaseUpdate U/D, Case D, User D, Alert D, superuser): $R"
          test "$R" = "f|f|f|f|f|f|f|f"
      - run: pnpm build
      - name: cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - name: playwright (mobile + desktop)
        run: pnpm exec playwright test
        env:
          # The app runs as the limited role; the Phase 2 fixtures seed their users and clear the
          # previous run's cases as the owner, which is the only role allowed to delete a Case.
          DATABASE_URL: ${{ env.APP_URL_DB }}
          E2E_OWNER_DATABASE_URL: ${{ env.OWNER_URL }}
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
