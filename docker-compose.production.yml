# Production stack for ER Navigator on the OCI host (Coolify + Traefik).
#
# Self-contained, like qch and endorsement: the app ships with its own Postgres, so this
# deployment can be created, moved or destroyed without touching any other system's data.
#
# How Coolify runs this file (verified 2026-09-08):
#   - Every variable set on the application in Coolify is written to a .env that Coolify
#     attaches to EVERY service as env_file. The `environment:` blocks below are therefore not
#     the only way a value reaches a container; they fix the value and the default. The app
#     image's entrypoint unsets everything that is not on its allowlist (docker/entrypoint.sh),
#     which is what keeps the owner password out of the app process.
#   - A deploy is STOP-THEN-START, not a rolling update: Coolify removes every container of this
#     application, then runs `docker compose up -d`. Expect about a minute of 404 per deploy
#     (db start + healthcheck, migrate, app start, first health probe). Merge outside shift
#     change. If `migrate` exits non-zero, `app` does not start and the site stays down until
#     the migration is resolved (docs/RUNBOOK.md, "Deploy failed at migrate").
#   - Coolify prefixes the named volume: on the host it is <app-uuid>_ernav-db. It also attaches
#     every service to a per-application network that coolify-proxy joins.
#
# Services:
#   db       postgres 16 with the first-boot init baked in (docker/postgres/Dockerfile)
#   migrate  one-shot: prisma migrate deploy + role sync + seed as the OWNER role, exits 0
#   app      Next.js standalone on :3000; runtime connects as the limited APP role
#   worker   threshold alerts, same image, `node worker.js`, no inbound traffic
services:
  db:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ernav}
      POSTGRES_USER: ${POSTGRES_USER:-ernav_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER:-ernav_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - ernav-db:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ernav_owner} -d ${POSTGRES_DB:-ernav}"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
      start_interval: 2s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    restart: "no"
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Owner role: schema changes, role reconciliation and seeding. Not used by `app`.
      DATABASE_URL: postgresql://${POSTGRES_USER:-ernav_owner}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ernav}?schema=public
      APP_DB_USER: ${APP_DB_USER:-ernav_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-Administrator}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      # App role: CRUD only; UPDATE/DELETE on AuditLog and CaseUpdate revoked at the DB.
      DATABASE_URL: postgresql://${APP_DB_USER:-ernav_app}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-ernav}?schema=public
      APP_URL: ${APP_URL:-https://nav.towardpcc.com}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Riyadh}
      REPORT_HEADER: ${REPORT_HEADER:-Qatif Central Hospital, Emergency Department. ER Navigator}
      TZ: UTC
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_TRUST_HOST: "true"
      # Outgoing mail for threshold alerts (Phase 6). Empty host = alerts logged, not sent.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-ER Navigator <no-reply@towardpcc.com>}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - coolify
      - internal
    labels:
      # Not a router. Tells Traefik which of this container's networks to reach it on;
      # coolify-proxy is not on `internal`.
      - traefik.docker.network=coolify
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
      start_interval: 2s

  # Threshold alerts (locked plan section 6). The same runner image with a different command, so
  # a deploy can never leave the worker on an older build than the app. It serves nothing, so it
  # is on `internal` only and coolify-proxy cannot reach it; it connects as the limited APP role,
  # which may INSERT into Alert, CaseUpdate and AuditLog and delete none of them.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    command: ["node", "worker.js"]
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${APP_DB_USER:-ernav_app}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-ernav}?schema=public
      APP_URL: ${APP_URL:-https://nav.towardpcc.com}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Riyadh}
      TZ: UTC
      ALERT_INTERVAL_MINUTES: ${ALERT_INTERVAL_MINUTES:-5}
      # username=address pairs for the active supervisors and admins. Empty = alerts are recorded
      # and logged, never emailed (User has no address column; the data model is authoritative).
      ALERT_EMAIL_MAP: ${ALERT_EMAIL_MAP:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-ER Navigator <no-reply@towardpcc.com>}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - internal
    healthcheck:
      # The worker touches /tmp/heartbeat at the end of every cycle. Unhealthy means no cycle has
      # finished for fifteen minutes, which at the default five-minute interval is three misses.
      test: ["CMD", "sh", "-c", "test $(( $(date +%s) - $(stat -c %Y /tmp/heartbeat) )) -lt 900"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  coolify:
    external: true
  internal:
    driver: bridge

volumes:
  ernav-db:
